<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paper AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #hint {
      position: fixed; left: 0; right: 0; bottom: 24px; z-index: 10;
      text-align: center; color: #fff; font: 15px/1.4 -apple-system, sans-serif;
      text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hint">把手机对准纸上的图片</div>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets>
      <video id="vid" src="./shower.mp4"
             preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-video src="#vid" width="1" height="1.739" position="0 0 0.001"></a-video>
    </a-entity>
  </a-scene>
  <script>
    const target = document.querySelector('#target');
    const hint = document.querySelector('#hint');
    const vid = document.querySelector('#vid');
    target.addEventListener('targetFound', () => {
      hint.style.display = 'none';
      vid.play().catch(() => {
        hint.textContent = '点一下屏幕播放';
        hint.style.display = 'block';
      });
    });
    target.addEventListener('targetLost', () => {
      vid.pause();
      hint.textContent = '把手机对准纸上的图片';
      hint.style.display = 'block';
    });
    document.body.addEventListener('click', () => {
      vid.play().then(() => { hint.style.display = 'none'; }).catch(() => {});
    });
  </script>
</body>
</html>
